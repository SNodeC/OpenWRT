name: OpenWrt packages
on:
  repository_dispatch:
    types: [OpenWRT-tag-changed]
permissions:
  contents: read
concurrency:
  group: openwrt-packages
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.event.client_payload.ref == 'refs/tags/OpenWRT' &&
      github.event.client_payload.before != github.event.client_payload.after &&
      github.event.client_payload.deleted == false &&
      (github.event.client_payload.repository == 'SNodeC/snode.c' ||
       github.event.client_payload.repository == 'SNodeC/mqttsuite')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: feed
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SNodeC/snode.c
          ref: refs/tags/OpenWRT
          submodules: recursive
          path: sources/snode.c
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SNodeC/mqttsuite
          ref: refs/tags/OpenWRT
          submodules: recursive
          path: sources/mqttsuite
          persist-credentials: false
      - name: Check signing setup
        env:
          OPENWRT_USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
          OPENWRT_APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
        run: |
          test -n "$OPENWRT_USIGN_KEY"
          test -n "$OPENWRT_APK_KEY"
      - name: Capture tagged sources and matrix
        id: matrix
        run: |
          python3 feed/tests/test_repository.py
          python3 feed/tests/test_ipk_audit.py
          python3 feed/ci/repository.py prepare sources bundle
          echo "value=$(python3 feed/ci/repository.py matrix)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tagged-sources
          path: bundle/
          if-no-files-found: error
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      PACKAGE_RELEASE: 1.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tagged-sources
          path: bundle
      - name: Unpack recipes and install SDK prerequisites
        run: |
          mkdir feed
          tar -xzf bundle/feed.tar.gz -C feed
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd
      - name: Download and verify official SDK
        env:
          MATRIX_ROW: ${{ toJSON(matrix) }}
        run: python3 feed/ci/repository.py sdk "$MATRIX_ROW" sdk
      - name: Build, audit and sign packages
        env:
          OPENWRT_USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
          OPENWRT_APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
        run: bash feed/ci/build.sh feed bundle sdk
      - name: Stage complete feed
        run: python3 feed/ci/repository.py stage sdk bundle output
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.series }}-${{ matrix.arch }}
          path: output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.series }}-${{ matrix.arch }}
          include-hidden-files: true
          path: |
            sdk/logs/
            sdk/audit/package-audit.json
            sdk/.config
            sdk/ci-sdk.json
  runtime:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        series: ['24.10', '25.12']
        arch: [x86_64, aarch64_generic]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tagged-sources
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ matrix.series }}-${{ matrix.arch }}
          path: output
      - name: Test installation and MQTT in an OpenWrt VM
        env:
          SERIES: ${{ matrix.series }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir feed
          tar -xzf bundle/feed.tar.gz -C feed
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-arm e2fsprogs openssl
          python3 feed/tests/test_feed_vm.py output "$SERIES" "$ARCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.series }}-${{ matrix.arch }}
          path: vm/logs/
  publish:
    needs: [build, runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tagged-sources
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: incoming
      - uses: actions/checkout@v4
        with:
          ref: main
          path: published
      - name: Publish all releases and architectures together
        working-directory: published
        run: |
          mkdir ../feed
          tar -xzf ../bundle/feed.tar.gz -C ../feed
          if git ls-remote --exit-code origin refs/heads/packages >/dev/null; then
            git fetch origin packages:refs/remotes/origin/packages
            git checkout -B packages origin/packages
          else
            git checkout --orphan packages
            git rm -rf .
          fi
          python3 ../feed/ci/repository.py publish ../incoming . ../bundle
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Publish packages from OpenWRT tags'
          python3 ../feed/ci/repository.py check ../bundle
          git push origin HEAD:packages
