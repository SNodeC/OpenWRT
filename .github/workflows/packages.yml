name: Unified distribution packages
on:
  workflow_call:
    inputs:
      snodec_tag:
        required: false
        type: string
      mqttsuite_tag:
        required: false
        type: string
      release_project:
        type: string
      release_tag:
        type: string
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          path: feed
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: packages
          path: published
          sparse-checkout: '**/build.json'
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Capture the source pair and full matrix
        id: matrix
        env:
          SNODEC_TAG: ${{ inputs.snodec_tag }}
          MQTTSUITE_TAG: ${{ inputs.mqttsuite_tag }}
          RELEASE_PROJECT: ${{ inputs.release_project }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_BRANCH: packages
          RECIPE_REF: main
        run: |
          export RELEASE_TAG="${RELEASE_TAG#refs/tags/}"
          python3 feed/ci/repository.py prepare published bundle
          python3 feed/ci/publication.py matrix > matrix.json
          echo "value=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: source-pair
          path: bundle/
          if-no-files-found: error
          overwrite: true
  allocate:
    needs: prepare
    uses: ./.github/workflows/package-write.yml
    with:
      operation: allocate
    secrets: inherit
  target:
    name: ${{ matrix.distribution }} · ${{ matrix.suite }} · ${{ matrix.arch }}
    needs: [prepare, allocate]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/package-target.yml
    with:
      target: ${{ toJSON(matrix) }}
      revision: ${{ needs.allocate.outputs.revision }}
    secrets: inherit
