name: Unified distribution packages
on:
  workflow_call:
    inputs:
      release_project:
        type: string
      release_tag:
        type: string
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      revisions: ${{ steps.matrix.outputs.revisions }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          path: feed
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: packages
          path: published
          sparse-checkout: '**/build.json'
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Capture the source pair and full matrix
        id: matrix
        env:
          RELEASE_PROJECT: ${{ inputs.release_project }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_BRANCH: packages
          RECIPE_REF: main
        run: |
          export RELEASE_TAG="${RELEASE_TAG#refs/tags/}"
          python3 feed/ci/repository.py prepare published bundle
          echo "revisions=$(jq -c . bundle/revisions.json)" >> "$GITHUB_OUTPUT"
          python3 feed/ci/publication.py matrix > matrix.json
          echo "value=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: source-pair
          path: bundle/
          if-no-files-found: error
          overwrite: true
  target:
    name: ${{ matrix.distribution }} · ${{ matrix.suite }} · ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/package-target.yml
    with:
      target: ${{ toJSON(matrix) }}
      revisions: ${{ needs.prepare.outputs.revisions }}
      release_project: ${{ inputs.release_project }}
    secrets: inherit
