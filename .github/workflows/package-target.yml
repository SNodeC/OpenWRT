name: Build and publish one distribution target
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      revision:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  build:
    name: Build and test ${{ fromJSON(inputs.target).id }}
    runs-on: ${{ fromJSON(inputs.target).runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      PACKAGE_RELEASE: ${{ inputs.revision }}
      TARGET_ID: ${{ fromJSON(inputs.target).id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source-pair
          path: bundle
      - name: Unpack captured packaging tools
        run: |
          mkdir feed
          tar -xzf bundle/feed.tar.gz -C feed
          python3 feed/ci/repository.py select bundle "$TARGET_ID"
          python3 feed/ci/repository.py reuse bundle "$TARGET_ID" dependencies
          echo "RELEASE_PROJECT=$(jq -r .release_project bundle/context.json)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
        if: fromJSON(inputs.target).family == 'linux' && contains(fromJSON('["armhf", "riscv64"]'), fromJSON(inputs.target).arch)
        with:
          platforms: arm,riscv64
      - name: Build and test OpenWRT packages
        if: fromJSON(inputs.target).family == 'openwrt'
        env:
          MATRIX_ROW: ${{ toJSON(fromJSON(inputs.target).build) }}
          OPENWRT_USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
          OPENWRT_APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd cmake qemu-user
          python3 feed/ci/repository.py sdk "$MATRIX_ROW" sdk
          bash feed/ci/build.sh feed bundle sdk
          python3 feed/ci/repository.py stage sdk bundle output
      - name: Build and test Raspberry Pi OS packages
        if: fromJSON(inputs.target).family == 'raspberrypi'
        env:
          SUITE: ${{ fromJSON(inputs.target).suite }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
          bash feed/ci/raspberrypi.sh "$SUITE"
      - name: Build and test Linux packages
        if: fromJSON(inputs.target).family == 'linux'
        env:
          MATRIX_ROW: ${{ toJSON(fromJSON(inputs.target).build) }}
          APT_SIGNING_KEY: ${{ (fromJSON(inputs.target).distribution == 'fedora' || fromJSON(inputs.target).distribution == 'rocky') && secrets.APT_SIGNING_KEY || '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg rpm createrepo-c
          bash feed/ci/linux.sh "$MATRIX_ROW"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ fromJSON(inputs.target).id }}
          path: output/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ fromJSON(inputs.target).id }}
          include-hidden-files: true
          overwrite: true
          path: |
            logs/
            sdk/logs/
            sdk/.config
            sdk/ci-sdk.json
  finish:
    name: Publish ${{ fromJSON(inputs.target).id }}
    if: always()
    needs: build
    uses: ./.github/workflows/package-write.yml
    with:
      operation: finish
      target: ${{ inputs.target }}
      result: ${{ needs.build.result }}
    secrets: inherit
