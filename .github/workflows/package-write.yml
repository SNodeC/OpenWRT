name: Serialized package snapshot writer
on:
  workflow_call:
    inputs:
      target:
        default: '{}'
        type: string
      result:
        type: string
      project:
        type: string
permissions:
  contents: write
  actions: read
jobs:
  write:
    name: Publish ${{ inputs.project }} · ${{ fromJSON(inputs.target).id }}
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: package-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/download-artifact@v8
        id: bundle
        with:
          name: source-pair
          path: bundle
      - uses: actions/download-artifact@v8
        if: inputs.result == 'success'
        with:
          name: packages-${{ inputs.project }}-${{ fromJSON(inputs.target).id }}
          path: incoming
      - uses: actions/checkout@v6
        with:
          ref: main
          path: published
      - name: Update the package snapshot
        id: write
        env:
          TARGET: ${{ inputs.target }}
          RESULT: ${{ inputs.result }}
          BUILD_PROJECT: ${{ inputs.project }}
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ inputs.result == 'success' && secrets.APT_SIGNING_KEY || '' }}
        run: |
          set -euo pipefail
          mkdir feed
          tar -xzf bundle/feed.tar.gz -C feed
          if [ "$RESULT" = success ]; then
            sudo apt-get update
            sudo apt-get install -y apt-utils gnupg rpm createrepo-c
          fi
          previous=
          if git -C published ls-remote --exit-code origin refs/heads/packages >/dev/null; then
            git -C published fetch origin packages
            previous=$(git -C published rev-parse FETCH_HEAD)
            git -C published checkout --detach "$previous"
          else
            git -C published checkout --orphan packages
            git -C published rm -rf .
          fi
          result=0
          python3 feed/ci/publication.py finish published bundle "$TARGET" "$RESULT" incoming "$BUILD_PROJECT" || result=$?
          bash feed/ci/push-packages.sh published "$previous" "Update packages: $BUILD_PROJECT"
          exit "$result"
