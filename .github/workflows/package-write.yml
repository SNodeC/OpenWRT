name: Serialized package snapshot writer
on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      target:
        default: '{}'
        type: string
      result:
        type: string
      project:
        type: string
    outputs:
      revisions:
        value: ${{ jobs.write.outputs.revisions }}
permissions:
  contents: write
  actions: read
jobs:
  write:
    name: ${{ inputs.operation == 'finish' && format('Publish {0} · {1}', inputs.project, fromJSON(inputs.target).id) || format('{0} packages', inputs.operation) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: package-publication
      cancel-in-progress: false
      queue: max
    outputs:
      revisions: ${{ steps.write.outputs.revisions }}
    steps:
      - uses: actions/download-artifact@v8
        id: bundle
        with:
          name: source-pair
          path: bundle
      - uses: actions/download-artifact@v8
        if: inputs.operation == 'finish' && inputs.result == 'success'
        with:
          name: packages-${{ inputs.project }}-${{ fromJSON(inputs.target).id }}
          path: incoming
      - uses: actions/checkout@v6
        with:
          ref: main
          path: published
      - name: Update the package snapshot
        id: write
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET: ${{ inputs.target }}
          RESULT: ${{ inputs.result }}
          BUILD_PROJECT: ${{ inputs.project }}
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ inputs.operation == 'finish' && inputs.result == 'success' && secrets.APT_SIGNING_KEY || '' }}
        run: |
          set -euo pipefail
          mkdir feed
          tar -xzf bundle/feed.tar.gz -C feed
          if [ "$OPERATION" = finish ] && [ "$RESULT" = success ]; then
            sudo apt-get update
            sudo apt-get install -y apt-utils gnupg rpm createrepo-c
          fi
          previous=
          if git -C published ls-remote --exit-code origin refs/heads/packages >/dev/null; then
            git -C published fetch origin packages
            previous=$(git -C published rev-parse FETCH_HEAD)
            git -C published checkout --detach "$previous"
          else
            git -C published checkout --orphan packages
            git -C published rm -rf .
          fi
          result=0
          python3 feed/ci/publication.py "$OPERATION" published bundle "$TARGET" "$RESULT" incoming "$BUILD_PROJECT" || result=$?
          bash feed/ci/push-packages.sh published "$previous" "Update packages: $OPERATION"
          exit "$result"
