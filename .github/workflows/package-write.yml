name: Serialized package snapshot writer
on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      target:
        default: '{}'
        type: string
      result:
        type: string
      run_id:
        default: ''
        type: string
      attempt:
        default: 1
        type: number
    outputs:
      revision:
        value: ${{ jobs.write.outputs.revision }}
permissions:
  contents: write
  actions: read
jobs:
  write:
    name: ${{ inputs.operation == 'finish' && format('Publish {0}', fromJSON(inputs.target).id) || format('{0} packages', inputs.operation) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: package-publication
      cancel-in-progress: false
      queue: max
    outputs:
      revision: ${{ steps.write.outputs.revision }}
    steps:
      - uses: actions/download-artifact@v8
        id: bundle
        if: inputs.operation != 'cleanup'
        continue-on-error: ${{ inputs.operation == 'reconcile' }}
        with:
          name: source-pair
          path: bundle
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        if: inputs.operation == 'finish' && inputs.result == 'success'
        with:
          name: packages-${{ fromJSON(inputs.target).id }}
          path: incoming
      - uses: actions/checkout@v6
        if: steps.bundle.outcome == 'success' || inputs.operation == 'cleanup'
        with:
          ref: main
          path: published
      - name: Update the package snapshot
        if: steps.bundle.outcome == 'success' || inputs.operation == 'cleanup'
        id: write
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET: ${{ inputs.target }}
          RESULT: ${{ inputs.result }}
          RECONCILE_ATTEMPT: ${{ inputs.attempt }}
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ inputs.operation == 'finish' && inputs.result == 'success' && secrets.APT_SIGNING_KEY || '' }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = cleanup ]; then
            git clone --depth 1 --branch main https://github.com/SNodeC/OpenWRT.git feed
          else
            mkdir feed
            tar -xzf bundle/feed.tar.gz -C feed
          fi
          if [ "$OPERATION" = finish ] && [ "$RESULT" = success ]; then
            sudo apt-get update
            sudo apt-get install -y apt-utils gnupg rpm createrepo-c
          fi
          previous=
          if git -C published ls-remote --exit-code origin refs/heads/packages >/dev/null; then
            git -C published fetch origin packages
            previous=$(git -C published rev-parse FETCH_HEAD)
            git -C published checkout --detach "$previous"
          else
            if [ "$OPERATION" = cleanup ]; then exit 0; fi
            git -C published checkout --orphan packages
            git -C published rm -rf .
          fi
          result=0
          python3 feed/ci/publication.py "$OPERATION" published bundle "$TARGET" "$RESULT" incoming || result=$?
          bash feed/ci/push-packages.sh published "$previous" "Update packages: $OPERATION"
          exit "$result"
