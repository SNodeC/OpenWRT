name: Package publication status
on:
  workflow_run:
    workflows: [Distribution packages]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  reconcile:
    if: >-
      contains(fromJSON('["workflow_dispatch", "repository_dispatch"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/package-write.yml
    with:
      operation: reconcile
      run_id: ${{ format('{0}', github.event.workflow_run.id) }}
      attempt: ${{ github.event.workflow_run.run_attempt }}
    secrets: inherit
